services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vdr
      POSTGRES_USER: vdr
      POSTGRES_PASSWORD: vdr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdr -d vdr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
